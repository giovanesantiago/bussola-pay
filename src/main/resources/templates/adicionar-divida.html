<!DOCTYPE html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/styleAdicionarDivida.css">
  <title>Bússola Pay - Adicionar Dívida</title>
</head>

<!--/*@thymesVar id="divida" type="br.com.bussolapay.model.DividaCreate"*/-->
<body>
<header class="header">
  <div class="header-container">
    <div class="header-left">
      <button class="btn-back" id="btnVoltar" title="Voltar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <h1 class="page-title">Adicionar Dívida</h1>
    </div>
  </div>
</header>

<main>
  <div class="form-container">
    <!-- Box de Erros do Backend -->
    <div th:if="${erros != null and !erros.isEmpty()}" class="error-box">
      <div class="error-box-header">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>Corrija os seguintes erros:</span>
      </div>
      <ul class="error-list">
        <li th:each="erro : ${erros}" th:text="${erro}"></li>
      </ul>
    </div>

    <form id="formAdicionarDivida" th:action="@{/divida}" method="post">
      <!-- Descrição -->
      <div class="form-group">
        <label for="descricao" class="form-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          Descrição
        </label>
        <input 
          type="text" 
          class="form-input" 
          id="descricao" 
          name="descricao" 
          placeholder="Ex: Conta de Luz, Fatura Nubank..."
          th:field="${divida.descricao}"
          required>
        <span class="error-span" id="error-descricao"></span>
      </div>

      <!-- Tipo de Dívida (Toggle) -->
      <div class="form-group">
        <label class="form-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          Tipo de Dívida
        </label>
        <div class="toggle-container">
          <button type="button" class="toggle-btn active" data-type="simples">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            </svg>
            Simples
          </button>
          <button type="button" class="toggle-btn" data-type="composta">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            Composta
          </button>
        </div>
        <input th:field="${divida.tipoDivida}" type="hidden" id="tipoDivida" name="tipoDivida" value="simples">
      </div>

      <!-- Campo hidden para as subdívidas (JSON) -->
      <input type="hidden" id="subDividasJson" name="subDividasJson" value="" th:field="${divida.subDividasJson}">

      <!-- Forma de Pagamento (apenas para dívida simples) -->
      <div class="form-group" id="formaPagamentoGroup">
        <label class="form-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
          </svg>
          Forma de Pagamento
        </label>
        <div class="toggle-container">
          <button type="button" class="toggle-btn-payment active" data-payment="vista">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            À Vista
          </button>
          <button type="button" class="toggle-btn-payment" data-payment="parcelada">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            Parcelada
          </button>
        </div>
        <input th:field="${divida.formaDePagamento}" type="hidden" id="formaPagamento" name="formaPagamento" value="A_VISTA">
      </div>

      <!-- Valor Total / Dívida Principal -->
      <div class="form-group" id="valorTotalGroup">
        <label for="valorTotal" class="form-label" id="labelValorTotal">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          Valor Total
        </label>
        <div class="input-with-prefix">
          <span class="input-prefix">R$</span>
          <input 
            type="text" 
            class="form-input with-prefix" 
            id="valorTotal" 
            name="valorTotal" 
            placeholder="0,00"
            th:field="${divida.valor}"
            required>
        </div>
        <span class="error-span" id="error-valorTotal"></span>
        <span class="info-text" id="infoValorTotal" style="display: none;">
          Este valor será calculado automaticamente pela soma dos itens
        </span>
      </div>

      <!-- Data de Vencimento / Primeira Parcela -->
      <div class="form-group">
        <label for="dataVencimento" class="form-label" id="labelDataVencimento">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Data de Vencimento
        </label>
        <input 
          type="date" 
          class="form-input" 
          id="dataVencimento" 
          name="dataVencimento"
          th:field="${divida.dataVecimento}"
          required>
        <span class="error-span" id="error-dataVencimento"></span>
      </div>

      <!-- Número de Parcelas (apenas para parcelada) -->
      <div class="form-group" id="parcelasGroup" style="display: none;">
        <label for="numeroParcelas" class="form-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <line x1="17" y1="5" x2="9" y2="19"></line>
          </svg>
          Número de Parcelas
        </label>
        <input 
          type="number" 
          class="form-input" 
          id="numeroParcelas" 
          name="numeroParcelas" 
          placeholder="Ex: 12"
          min="2"
          th:field="${divida.parcelamento}"
          max="120">
        <span class="error-span" id="error-numeroParcelas"></span>
        <span class="info-text" id="infoParcelamento" style="display: none;">
          Valor Total: <strong id="valorParcela">R$ 0,00</strong>
        </span>
      </div>

      <!-- Seção de Itens da Dívida (apenas para dívida composta) -->
      <div class="items-section" id="itemsSection" style="display: none;">
        <div class="items-header">
          <h3 class="items-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            Itens da Dívida (Sub-Dívidas)
          </h3>
          <button type="button" class="btn-add-item" id="btnAddItem">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Adicionar Item
          </button>
        </div>

        <div class="items-list" id="itemsList">
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <p>Nenhum item adicionado ainda</p>
            <span>Clique em "Adicionar Item" para começar</span>
          </div>
        </div>

      </div>

      <!-- Botões de Ação -->
      <div class="form-actions">
        <button type="button" class="btn-secondary" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn-primary" id="btnSalvar">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Salvar Dívida
        </button>
      </div>
    </form>
  </div>
</main>

<!-- Modal para Adicionar Item -->
<div class="modal" id="modalAddItem">
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title">Adicionar Item</h3>
      <button type="button" class="btn-close-modal" id="btnCloseModal">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="itemDescricao" class="form-label">Descrição do Item</label>
        <input 
          type="text" 
          class="form-input" 
          id="itemDescricao" 
          placeholder="Ex: Parcela 1, Item A...">
      </div>
      <div class="form-group">
        <label for="itemValor" class="form-label" id="labelItemValor">Valor</label>
        <div class="input-with-prefix">
          <span class="input-prefix">R$</span>
          <input 
            type="text" 
            class="form-input with-prefix" 
            id="itemValor" 
            placeholder="0,00">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
          </svg>
          Forma de Pagamento
        </label>
        <div class="toggle-container">
          <button type="button" class="toggle-btn-item-payment active" data-item-payment="vista">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            À Vista
          </button>
          <button type="button" class="toggle-btn-item-payment" data-item-payment="parcelada">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            Parcelada
          </button>
        </div>
      </div>
      <div class="form-group" id="itemParcelasGroup" style="display: none;">
        <label for="itemNumeroParcelas" class="form-label">Número de Parcelas</label>
        <input 
          type="number" 
          class="form-input" 
          id="itemNumeroParcelas" 
          placeholder="Ex: 12"
          min="2"
          max="120">
        <span class="info-text" id="infoItemParcelamento" style="display: none;">
          Valor Total: <strong id="itemValorParcela">R$ 0,00</strong>
        </span>

      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-secondary" id="btnCancelarItem">Cancelar</button>
      <button type="button" class="btn-primary" id="btnSalvarItem">Adicionar</button>
    </div>
  </div>
</div>

<script src="/js/adicionar-divida.js"></script>
</body>
</html>
